backend:
  name: github
  repo: SANC-LPS/sanc-website
  branch: main

# Global slug rules. Keeps non-ASCII characters (curly quotes, em-dashes,
# accents) out of generated URLs; applies to every future post.
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

media_folder: "blog-src/images"
public_folder: "/blog/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "blog-src/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Cover Image", name: "image", widget: "image", required: false}
      - {label: "Category", name: "tags", widget: "select", options: ["theology", "music", "culture"], multiple: true}
      - {label: "Excerpt", name: "excerpt", widget: "text"}
      - {label: "Body", name: "body", widget: "markdown"}
