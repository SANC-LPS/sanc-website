<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found &mdash; Second Adam &amp; the New Creations</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/site-img/favicon-32.png">
<link rel="icon" href="/site-img/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" sizes="180x180" href="/site-img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --charcoal: #1a1a18;
    --ink: #0d0d0b;
    --parchment: #e8e0cc;
    --amber: #c8872a;
    --gold: #e8b84b;
    --muted: #8a8070;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: var(--ink);
    color: var(--parchment);
    font-family: 'IM Fell English', serif;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  /* NAV */
  nav {
    padding: 1.2rem 3rem;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(200,135,42,0.12);
  }
  .nav-brand {
    display: flex; flex-direction: column; align-items: flex-start;
    text-decoration: none; line-height: 1;
  }
  .nav-brand-logo {
    font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; font-weight: 400;
    letter-spacing: 0.12em; color: var(--gold); line-height: 1;
    text-shadow: 0 0 30px rgba(232,184,75,0.25);
  }
  .nav-brand-full {
    font-family: 'Special Elite', cursive; font-size: 0.48rem;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--parchment); opacity: 0.6; margin-top: 0.25rem;
  }
  .nav-links { display: flex; gap: 2.5rem; list-style: none; }
  .nav-links a {
    font-family: 'Special Elite', cursive; font-size: 0.72rem;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--parchment); text-decoration: none; opacity: 0.8;
    transition: color 0.3s, opacity 0.3s;
  }
  .nav-links a:hover { color: var(--gold); opacity: 1; }

  /* BODY */
  main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 4rem 2rem;
  }
  .code {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(5rem, 18vw, 10rem); line-height: 1;
    color: rgba(200,135,42,0.22); letter-spacing: 0.06em;
  }
  .lead {
    font-family: 'Playfair Display', serif; font-weight: 700;
    font-size: clamp(1.4rem, 4vw, 2.2rem); color: var(--parchment);
    margin-top: 0.5rem;
  }
  .sub {
    font-style: italic; font-size: 1rem; color: var(--muted);
    line-height: 1.9; margin-top: 1rem; max-width: 460px;
  }
  .divider { width: 55px; height: 2px; background: var(--amber); margin: 2rem auto; }
  .links { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }
  .links a {
    font-family: 'Special Elite', cursive; font-size: 0.6rem;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--amber); text-decoration: none;
    border: 1px solid rgba(200,135,42,0.28);
    padding: 0.55rem 1.2rem; border-radius: 999px;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .links a:hover {
    background: rgba(200,135,42,0.15); border-color: var(--amber); color: var(--gold);
  }

  footer {
    border-top: 1px solid rgba(200,135,42,0.12); padding: 1.6rem 3rem; text-align: center;
  }
  footer p {
    font-family: 'Special Elite', cursive; font-size: 0.58rem;
    letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase;
  }

  @media (max-width: 768px) {
    nav { padding: 1rem 1.5rem; }
    .nav-links { gap: 1.2rem; }
    .nav-links a { font-size: 0.62rem; }
    footer { padding: 1.4rem 1.5rem; }
  }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="/">
    <span class="nav-brand-logo">SANC</span>
    <span class="nav-brand-full">Second Adam &amp; the New Creations</span>
  </a>
  <ul class="nav-links">
    <li><a href="/#music">Music</a></li>
    <li><a href="/blog">Blog</a></li>
    <li><a href="/#connect">Connect</a></li>
    <li><a href="/merch">Merch</a></li>
  </ul>
</nav>

<main>
  <div class="code">404</div>
  <h1 class="lead">That page doesn&rsquo;t exist</h1>
  <p class="sub">The link may be broken, or the page may have moved. Everything else is still here.</p>
  <div class="divider"></div>
  <div class="links">
    <a href="/">Home</a>
    <a href="/#music">Music</a>
    <a href="/blog">Blog</a>
    <a href="/merch">Merch</a>
  </div>
</main>

<footer>
  <p>&copy; 2025 Second Adam &amp; the New Creations</p>
</footer>

</body>
</html>
